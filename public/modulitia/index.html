<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/logosvg.svg" type="image/svg+xml" />

    <title>Modulitia — En construcción | GannetLabs</title>
    <meta name="description" content="Estamos rediseñando la página de Modulitia. Volvé en unos días o escribinos si querés conocer el producto ahora." />
    <meta property="og:title" content="Modulitia — En construcción" />
    <meta property="og:description" content="Estamos rediseñando esta página. Mientras tanto, escribinos y te contamos todo." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />

    <style>
      /* GannetLabs identity — dark navy base + mint accent.
         Mirrors the tokens in src/index.css so this standalone page stays in
         step with the React site without pulling in its build. */
      :root {
        --background: 240 44% 7%;
        --foreground: 0 0% 98%;
        --muted-foreground: 240 10% 65%;
        --border: 240 20% 18%;
        --brand: 141 56% 67%;
        --gradient-hero: linear-gradient(
          to right bottom,
          hsl(141 70% 78%) 0%,
          hsl(152 80% 55%) 55%,
          hsl(168 70% 42%) 100%
        );
        --spatial: cubic-bezier(0.32, 0.72, 0, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      h1 {
        font-family: "Manrope", "Inter", ui-sans-serif, system-ui, sans-serif;
      }

      /* Layered background: grid, then a mint glow that fades the grid out
         toward the edges so the page reads as one soft pool of light. */
      .backdrop {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .backdrop::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, hsl(240 20% 18% / 0.35) 1px, transparent 1px),
          linear-gradient(to bottom, hsl(240 20% 18% / 0.35) 1px, transparent 1px);
        background-size: 56px 56px;
        -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 42%, #000 0%, transparent 100%);
        mask-image: radial-gradient(ellipse 70% 60% at 50% 42%, #000 0%, transparent 100%);
      }

      .backdrop::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 38%;
        width: min(880px, 130vw);
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, hsl(var(--brand) / 0.16) 0%, transparent 62%);
        animation: halo 9s var(--spatial) infinite;
      }

      @keyframes halo {
        0%,
        100% {
          opacity: 0.7;
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.08);
        }
      }

      main {
        position: relative;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        padding: 5rem 1.5rem 2rem;
        text-align: center;
      }

      .mark {
        width: 3.5rem;
        color: hsl(var(--brand));
        filter: drop-shadow(0 0 28px hsl(var(--brand) / 0.35));
        animation: drift 7s ease-in-out infinite;
      }

      @keyframes drift {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.4rem 0.9rem 0.4rem 0.7rem;
        border: 1px solid hsl(var(--border));
        border-radius: 999px;
        background: linear-gradient(180deg, hsl(240 24% 16%) 0%, hsl(240 30% 10% / 0.8) 100%);
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: hsl(0 0% 82%);
      }

      .pulse {
        position: relative;
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 999px;
        background: hsl(var(--brand));
      }

      .pulse::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: inherit;
        animation: ping 2s var(--spatial) infinite;
      }

      @keyframes ping {
        0% {
          opacity: 0.7;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(2.8);
        }
      }

      .eyebrow {
        margin: 0;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: hsl(var(--muted-foreground));
      }

      h1 {
        margin: 0.4rem 0 0;
        font-size: clamp(2.5rem, 9vw, 4.5rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.02;
        background: var(--gradient-hero);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      .lead {
        max-width: 34rem;
        margin: 0;
        font-size: clamp(1rem, 2.4vw, 1.125rem);
        line-height: 1.65;
        color: hsl(var(--muted-foreground));
      }

      /* Indeterminate progress: the work is happening, we just aren't
         promising a percentage. */
      .track {
        position: relative;
        width: min(22rem, 80vw);
        height: 2px;
        border-radius: 999px;
        background: hsl(var(--border));
        overflow: hidden;
      }

      .track::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: var(--gradient-hero);
        animation: sweep 2.6s var(--spatial) infinite;
      }

      @keyframes sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.7rem 1.35rem;
        border-radius: 0.5rem;
        border: 1px solid transparent;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        transition:
          transform 0.35s var(--spatial),
          background-color 0.35s var(--spatial),
          border-color 0.35s var(--spatial),
          color 0.35s var(--spatial);
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn:focus-visible {
        outline: 2px solid hsl(var(--brand));
        outline-offset: 3px;
      }

      .btn-primary {
        background: hsl(var(--foreground));
        color: hsl(var(--background));
      }

      .btn-primary:hover {
        background: hsl(var(--brand));
      }

      .btn-ghost {
        border-color: hsl(var(--border));
        color: hsl(0 0% 88%);
      }

      .btn-ghost:hover {
        border-color: hsl(var(--brand) / 0.5);
        color: hsl(var(--brand));
      }

      footer {
        position: relative;
        margin-top: auto;
        padding: 2rem 1.5rem 0;
        font-size: 0.8rem;
        color: hsl(240 10% 45%);
      }

      /* Staggered entrance, mirroring the site's FadeUp animation. */
      .reveal {
        opacity: 0;
        transform: translateY(14px);
        animation: reveal 0.7s var(--spatial) forwards;
      }

      .reveal:nth-child(1) { animation-delay: 0.05s; }
      .reveal:nth-child(2) { animation-delay: 0.15s; }
      .reveal:nth-child(3) { animation-delay: 0.25s; }
      .reveal:nth-child(4) { animation-delay: 0.35s; }
      .reveal:nth-child(5) { animation-delay: 0.45s; }
      .reveal:nth-child(6) { animation-delay: 0.55s; }

      @keyframes reveal {
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }

        .reveal {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="backdrop" aria-hidden="true"></div>

    <main>
      <svg class="mark reveal" viewBox="215.269 0 141.436 141.778" fill="currentColor" aria-hidden="true">

      </svg>

      <span class="badge reveal">
        <span class="pulse" aria-hidden="true"></span>
        En construcción
      </span>

      <div class="reveal">
        <p class="eyebrow">GannetLabs</p>
        <h1>Modulitia</h1>
      </div>

      <p class="lead reveal">
        Estamos rediseñando esta página de arriba a abajo. El producto sigue vivo
        y andando: solo le estamos dando la presentación que se merece.
      </p>

      <div class="track reveal" role="img" aria-label="Trabajo en progreso"></div>

      <div class="actions reveal">
        <a class="btn btn-primary" href="/">Ir a GannetLabs</a>
        <a class="btn btn-ghost" href="mailto:contacto@gannetlabs.com?subject=Quiero%20conocer%20Modulitia">
          Escribinos
        </a>
      </div>

      <footer>© <span id="year">2026</span> GannetLabs</footer>
    </main>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
